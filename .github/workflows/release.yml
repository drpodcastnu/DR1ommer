name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # build.gradle.kts pins jvmToolchain(25), even though the bytecode targets 21.
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :ommer:shadowJar

      - run: gh release create "$GITHUB_REF_NAME" ommer/build/libs/ommer.jar --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
